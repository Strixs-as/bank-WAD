# SQL Server Configuration for SSMS 2021
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BankSystem;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa

# Mail properties (Gmail SMTP)
# IMPORTANT: keep single source of truth; allow env override via APP_MAIL_HOST/APP_MAIL_PORT.
# (Avoid defining spring.mail.host twice; it can hide overrides and create confusion.)
spring.mail.host=${APP_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${APP_MAIL_PORT:587}
# NOTE: must be a real Gmail login (typo like gmail.com will break SMTP auth)
spring.mail.username=evgenievictolan@gmail.com
# NOTE: Gmail App Password (not the regular account password)
# SECURITY: do not store secrets in git. Provide via environment variable.
# PowerShell example:
#   $env:SPRING_MAIL_PASSWORD="<app-password>"
spring.mail.password=${SPRING_MAIL_PASSWORD:${SPRING_MAIL_APP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
# From address (usually the same as username)
spring.mail.properties.mail.from=${spring.mail.username}

# Extra SMTP hardening / compatibility
spring.mail.properties.mail.transport.protocol=smtp
# Shorter timeouts for dev: do not freeze UI for 15s if SMTP is blocked
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Notifications
# Optional: admin email to receive copies of login/events. Empty = do not notify admin.
app.notifications.admin-email=

# Hibernate Configuration
# ?????: ????? ?????? ?????? ?????????? (Flyway), ????? Hibernate ddl-auto=update ????? ?????????? ALTER TABLE
# ? ???????? NOT NULL ??????? ? ???????? ???????, ??? ? SQL Server ??????.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=true

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=3m

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.techstore.bank_system=DEBUG

# Logging (mail)
# Keep mail logs quiet by default; enable when debugging SMTP
logging.level.org.springframework.mail=INFO
logging.level.org.springframework.boot.autoconfigure.mail=INFO

# Static Resources
spring.web.resources.static-locations=classpath:/static/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/public/

# Mail hardening / stability
# Control via env: $env:APP_MAIL_ENABLED="true"|"false"
# For sqlserver profile we WANT real emails by default.
app.mail.enabled=${APP_MAIL_ENABLED:true}

# Optional: easy switch to local SMTP (MailHog/Papercut) without changing repo files:
#   $env:APP_MAIL_HOST="localhost"; $env:APP_MAIL_PORT="1025"; $env:APP_MAIL_ENABLED="true"
# IMPORTANT: do NOT reference ${spring.mail.host} inside spring.mail.host (it creates a circular placeholder)
